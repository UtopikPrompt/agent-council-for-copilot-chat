name: Publish VS Code extension

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: publish-extension
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - name: Assign unique patch version
              run: |
                  version=$(node -e "const [major, minor, patch] = require('./package.json').version.split('.').map(Number); console.log([major, minor, patch + Number(process.env.GITHUB_RUN_NUMBER)].join('.'))")
                  npm version "$version" --no-git-tag-version
                  echo "Publishing version $version"
            - name: Run checks
              run: npm run vscode:prepublish
            - name: Publish to VS Code Marketplace
              run: npx --yes @vscode/vsce publish
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
