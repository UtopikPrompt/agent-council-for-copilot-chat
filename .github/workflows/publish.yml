name: Publish VS Code extension

on:
    release:
        types: [published]

permissions:
    contents: read

concurrency:
    group: publish-extension
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - name: Set version from release tag
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  IS_PRERELEASE: ${{ github.event.release.prerelease }}
              run: |
                  version="${RELEASE_TAG#v}"
                  semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

                  if [[ ! "$version" =~ $semver_regex ]]; then
                      echo "Invalid SemVer version: $version" >&2
                      exit 1
                  fi

                  version_base="${version%%+*}"
                  if [[ "$version_base" == *-* ]]; then
                      prerelease="${version_base#*-}"
                      IFS='.' read -r -a prerelease_identifiers <<< "$prerelease"
                      for identifier in "${prerelease_identifiers[@]}"; do
                          if [[ "$identifier" =~ ^[0-9]+$ ]] && [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                              echo "Invalid SemVer prerelease identifier: $identifier" >&2
                              exit 1
                          fi
                      done
                  fi

                  is_semver_prerelease="false"
                  if [[ "$version_base" == *-* ]]; then
                      is_semver_prerelease="true"
                  fi

                  if [[ "$IS_PRERELEASE" != "$is_semver_prerelease" ]]; then
                      echo "GitHub prerelease setting ($IS_PRERELEASE) does not match SemVer prerelease ($is_semver_prerelease) for version $version" >&2
                      exit 1
                  fi

                  npm version "$version" --no-git-tag-version
                  echo "Publishing version $version"
            - name: Run checks
              run: npm run vscode:prepublish
            - name: Publish to VS Code Marketplace
              run: |
                  if [[ "$IS_PRERELEASE" == "true" ]]; then
                      npx --yes @vscode/vsce publish --pre-release
                  else
                      npx --yes @vscode/vsce publish
                  fi
              env:
                  IS_PRERELEASE: ${{ github.event.release.prerelease }}
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
