name: Publish VS Code extension

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npx --yes @vscode/vsce publish
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
